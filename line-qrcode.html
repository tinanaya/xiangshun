<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入 LINE 客服 | 祥順當鋪</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans leading-normal tracking-normal flex flex-col min-h-screen">

    <!-- 簡易導覽列 Navbar -->
    <nav class="bg-white shadow-md w-full">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0">
                    <a href="index.html" class="font-bold text-2xl text-blue-800 tracking-wider">祥順當鋪</a>
                </div>
                <div>
                    <a href="index.html" class="text-blue-600 hover:text-blue-800 transition font-bold">&larr; 回首頁</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- QR Code 內容區 -->
    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border border-gray-100 p-8 text-center">
            <div class="w-16 h-16 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 font-bold">L</div>
            <h1 class="text-2xl font-extrabold text-gray-900 mb-2">加入祥順 LINE 客服</h1>
            <p class="text-gray-500 mb-8">24小時專人為您服務，免費線上諮詢</p>

            <div class="bg-gray-100 p-4 rounded-xl inline-block mb-6 border-2 border-dashed border-gray-300">
                <!-- QR Code 產生器的連結已更新為 Chi_randy -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://line.me/ti/p/~Chi_randy" 
                     alt="LINE QR Code" 
                     class="w-48 h-48 object-cover rounded shadow-sm mx-auto">
            </div>

            <div class="text-xl font-bold text-gray-800 tracking-wider mb-8">
                <!-- 顯示文字已更新 -->
                LINE ID: <span class="text-green-600">Chi_randy</span>
            </div>

            <!-- 手機版跳轉連結已更新為 Chi_randy -->
            <a href="https://line.me/ti/p/~Chi_randy" target="_blank" class="block w-full bg-green-500 text-white px-6 py-4 rounded-full font-bold hover:bg-green-600 transition shadow-lg text-lg flex items-center justify-center mb-4">
                <span class="mr-2">📲</span> 手機直接點此加入
            </a>
            <a href="index.html" class="block text-gray-500 hover:text-gray-700 font-medium transition mt-4">先不用，回到首頁</a>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-gray-900 text-gray-300 py-6 text-center text-sm">
        <p>Copyright 2024 &copy; All Rights Reserved 祥順當鋪</p>
    </footer>

</body>
</html>
